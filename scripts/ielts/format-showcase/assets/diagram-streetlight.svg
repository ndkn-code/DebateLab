<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t">
  <title id="t">Full cut-off streetlight diagram</title>
  <style>
    .lbl{font-family:Inter,Arial,sans-serif;font-size:16px;fill:#333}
    .pin{fill:#333}
    .pint{font-family:Inter,Arial,sans-serif;font-size:14px;font-weight:700;fill:#fff;text-anchor:middle;dominant-baseline:central}
    .ld{stroke:#555;stroke-width:1.5;fill:none}
  </style>
  <rect width="800" height="600" fill="#f4f5f7"/>
  <!-- ground -->
  <line x1="60" y1="540" x2="740" y2="540" stroke="#9aa0a6" stroke-width="3"/>
  <text class="lbl" x="400" y="570" text-anchor="middle">Road / pavement</text>
  <!-- pole -->
  <rect x="300" y="120" width="20" height="420" fill="#c3c7cc" stroke="#777" stroke-width="2"/>
  <rect x="280" y="520" width="60" height="20" fill="#a9adb3" stroke="#777" stroke-width="2"/>
  <text class="lbl" x="260" y="330" text-anchor="end">Pole</text>
  <line class="ld" x1="265" y1="325" x2="298" y2="325"/>
  <!-- arm -->
  <path d="M310 130 Q 330 80 420 80" fill="none" stroke="#777" stroke-width="12" stroke-linecap="round"/>
  <!-- shield / hood (Q36) above the lamp head -->
  <path d="M380 92 L520 92 L500 70 L400 70 Z" fill="#e9ecef" stroke="#555" stroke-width="2"/>
  <!-- lamp head -->
  <rect x="400" y="92" width="100" height="22" rx="4" fill="#d7dadf" stroke="#555" stroke-width="2"/>
  <text class="lbl" x="450" y="140" text-anchor="middle">Lamp head</text>
  <!-- light cone directed downwards -->
  <path d="M410 114 L340 540 L560 540 L490 114 Z" fill="#fff3c4" opacity="0.7"/>
  <text class="lbl" x="450" y="470" text-anchor="middle">Light directed downwards</text>
  <!-- sensor unit (Q37) -->
  <rect x="320" y="260" width="34" height="34" rx="4" fill="#d7dadf" stroke="#555" stroke-width="2"/>
  <circle cx="337" cy="277" r="6" fill="#8fb0cc" stroke="#555" stroke-width="1.5"/>
  <!-- controller below the sensor -->
  <rect x="320" y="330" width="34" height="50" rx="4" fill="#e9ecef" stroke="#555" stroke-width="2"/>
  <text class="lbl" x="370" y="360">Controller (dims lamp)</text>
  <!-- callout 36 at 70% x, 14% y -> (560, 84) -->
  <line class="ld" x1="520" y1="82" x2="545" y2="84"/>
  <circle class="pin" cx="560" cy="84" r="15"/>
  <text class="pint" x="560" y="84">36</text>
  <!-- callout 37 at 72% x, 46% y -> (576, 276) -->
  <line class="ld" x1="354" y1="277" x2="560" y2="276"/>
  <circle class="pin" cx="576" cy="276" r="15"/>
  <text class="pint" x="576" y="276">37</text>
</svg>
