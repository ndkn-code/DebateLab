swagger: '2.0'
info:
  title: Thinkfy center operations callbacks
  version: '1.0'
schemes: [https]
host: center-operations.example.invalid
x-google-endpoints:
  - name: center-operations.example.invalid
    allowCors: false
paths:
  /oauth/google/callback:
    get:
      operationId: googleOAuthCallback
      responses: { '200': { description: OK } }
      x-google-backend: { address: 'https://CENTER_OPERATIONS_CLOUD_RUN_URL', path_translation: APPEND_PATH_TO_ADDRESS }
  /callbacks/google:
    post:
      operationId: googleCallback
      responses: { '200': { description: OK } }
      x-google-backend: { address: 'https://CENTER_OPERATIONS_CLOUD_RUN_URL', path_translation: APPEND_PATH_TO_ADDRESS }
  /callbacks/zbs/{connectionId}:
    post:
      operationId: zbsCallback
      parameters: [{ name: connectionId, in: path, required: true, type: string }]
      responses: { '200': { description: OK } }
      x-google-backend: { address: 'https://CENTER_OPERATIONS_CLOUD_RUN_URL', path_translation: APPEND_PATH_TO_ADDRESS }
  /callbacks/zalopay/{connectionId}:
    post:
      operationId: zalopayCallback
      parameters: [{ name: connectionId, in: path, required: true, type: string }]
      responses: { '200': { description: OK } }
      x-google-backend: { address: 'https://CENTER_OPERATIONS_CLOUD_RUN_URL', path_translation: APPEND_PATH_TO_ADDRESS }
